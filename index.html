<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeycomb</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="main">
        <header id="toolbar">
          <div class="view-heading">
            <h1 id="view-title">Music</h1>
            <span id="view-summary" class="muted"></span>
          </div>
          <input id="search" type="search" placeholder="Search" spellcheck="false" autocomplete="off" />
        </header>
        <section id="browser"></section>
        <section id="tracklist"></section>
      </main>
      <aside id="nowplaying"></aside>
    </div>
    <footer id="playerbar"></footer>
    <div id="toast"></div>
  </body>
</html>
