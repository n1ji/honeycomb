name: Build

# Actions are pinned to commit hashes (the tag they were is in the comment).
#
# Alpha builds: push a tag made by scripts/release.sh, like v0.1.1 (builds macOS
# and Windows, with that version's CHANGELOG.md section as the notes), or run
# manually from the Actions tab and pick the platforms. Builds a universal macOS
# .dmg, a Windows installer, and (on manual runs that ask for it) Linux
# AppImage/.deb/.rpm packages, and attaches them to a draft pre-release.
#
# Linux joins tag builds when it's ready for a release: add it to the tag default in the plan job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build, comma-separated: macos, windows, linux"
        default: "windows,linux"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'macos,windows' }}
        run: |
          rows=()
          [[ ",$WANT," == *",macos,"* ]] && rows+=('{"name":"macos","platform":"macos-latest","args":"--target universal-apple-darwin"}')
          [[ ",$WANT," == *",windows,"* ]] && rows+=('{"name":"windows","platform":"windows-latest","args":""}')
          # The oldest supported Ubuntu, so the AppImage runs on older distros too.
          [[ ",$WANT," == *",linux,"* ]] && rows+=('{"name":"linux","platform":"ubuntu-22.04","args":""}')
          if [ ${#rows[@]} -eq 0 ]; then echo "No platforms picked from: $WANT" >&2; exit 1; fi
          echo "matrix={\"include\":[$(IFS=,; echo "${rows[*]}")]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # WebKitGTK and GTK for the window, ALSA for audio output, patchelf
          # and rpm for packaging.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf rpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The scrobbling plugin's Last.fm API key, from the repo's secrets. It's
      # written into the bundled plugin here and never committed; builds
      # without it ask users for their own key.
      - name: Last.fm key for the scrobbling plugin
        shell: bash
        env:
          LASTFM_KEY: ${{ secrets.HONEYCOMB_LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.HONEYCOMB_LASTFM_SECRET }}
        run: |
          if [ -n "$LASTFM_KEY" ] && [ -n "$LASTFM_SECRET" ]; then
            node -e 'const { LASTFM_KEY: key, LASTFM_SECRET: secret } = process.env;
              require("fs").writeFileSync("plugins/scrobbling/lastfm-key.js", "export default " + JSON.stringify({ key, secret }) + ";\n");'
            echo "Last.fm key added."
          else
            echo "No Last.fm key in the repo secrets; this build asks users for their own."
          fi

      # The release body is this version's CHANGELOG.md section (Unreleased
      # on manual runs), followed by the install notes.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<HONEYCOMB_NOTES_END"
            scripts/release-notes.sh "${{ github.ref_type == 'tag' && github.ref_name || 'Unreleased' }}"
            echo
            echo "HONEYCOMB_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # In-app updates: with the signing key in the repo secrets, the build
      # also makes signed update files, and tauri-action attaches latest.json
      # (which the app reads to find and verify them). The public half of the
      # key is plugins.updater.pubkey in tauri.conf.json.
      - name: Update signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Update files will be signed."
          else
            echo "No signing key in the repo secrets; this build can't be installed from inside the app."
          fi

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Honeycomb ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            Alpha build. Not code-signed yet:
            - macOS: open Honeycomb once and close the warning, then System Settings → Privacy & Security → "Open Anyway" (or run `xattr -cr /Applications/Honeycomb.app`).
            - Windows: SmartScreen may warn; choose "More info" → "Run anyway".
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  # SHA256SUMS.txt for everything attached to the (draft) release.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # Drafts can't be looked up by tag, so find it in the list.
          release=$(curl -fsSL "${auth[@]}" "$api/releases?per_page=30" | jq -r --arg t "$TAG" '[.[] | select(.tag_name == $t)][0]')
          id=$(jq -r .id <<<"$release")
          mkdir assets && cd assets
          jq -r '.assets[] | "\(.id) \(.name)"' <<<"$release" | while read -r aid name; do
            if [ "$name" = SHA256SUMS.txt ]; then
              curl -fsSL -X DELETE "${auth[@]}" "$api/releases/assets/$aid"
              continue
            fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              -o "$name" "$api/releases/assets/$aid"
          done
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          curl -fsSL -X POST "${auth[@]}" -H "Content-Type: text/plain" --data-binary @../SHA256SUMS.txt \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=SHA256SUMS.txt" > /dev/null
