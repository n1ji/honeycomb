[package]
name = "honeycomb"
version = "0.1.1"
description = "Honeycomb - a fast, library-focused music player"
authors = ["n1ji"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "honeycomb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
lofty = "0.22"
# Playback: symphonia decodes on its own thread into a ring buffer (rtrb) that
# the cpal output callback copies from; rubato resamples when the device can't
# run at the file's rate.
cpal = "0.16"
symphonia = { version = "0.5", features = ["all-formats", "all-codecs"] }
rubato = "0.16"
rtrb = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rand = "0.8"
plist = "1"
unicode-normalization = "0.1"
# System media keys and now-playing info (macOS Now Playing, MPRIS on Linux, SMTC on Windows).
# LRCLIB lyrics lookups.
ureq = { version = "2", features = ["json"] }
# Last.fm request signatures are MD5 hashes.
# Free space on a sync destination.
fs2 = "0.4"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Login tokens in the system credential store (Keychain, Credential Manager,
# Secret Service over zbus, so Linux still needs no libdbus).
keyring = "4.2"
tauri-plugin-updater = "2"
# Converting lossless files while syncing: LAME (MP3, gapless via its LAME
# tag), libvorbis and a pure-Rust FLAC encoder, all built in. AAC uses the
# system's encoder (afconvert on macOS).
mp3lame-encoder = "0.2"
vorbis_rs = "0.5"
flacenc = { version = "0.5", default-features = false }

[dev-dependencies]
# Mock runtime for driving the player in tests.
tauri = { version = "2", features = ["test"] }

# Optimize dependencies in dev builds: unoptimized audio decoding and tag
# parsing are slow enough to stutter and to make library scans crawl.
[profile.dev.package."*"]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
